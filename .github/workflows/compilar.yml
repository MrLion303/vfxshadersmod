name: Compilar el mod

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar con Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'


      - name: Preparar validador GLSL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslang-tools

      - name: Validar shaders GLSL
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' shader; do
            case "$shader" in
              *.fsh) stage=frag ;;
              *.vsh) stage=vert ;;
              *) continue ;;
            esac
            echo "Validando shader: $shader"
            glslangValidator -S "$stage" "$shader"
          done < <(find src/main/resources/assets/vfxshadersmod/shaders/core/vfx -type f \( -name '*.fsh' -o -name '*.vsh' \) -print0)

      - name: Validar JSON de recursos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("src/main/resources").rglob("*.json"))
          for file in files:
              with file.open(encoding="utf-8") as stream:
                  json.load(stream)
              print(f"JSON válido: {file}")
          PY

      - name: Compilar
        run: gradle build

      - name: Guardar el JAR compilado
        uses: actions/upload-artifact@v7
        with:
          name: vfxshadersmod-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
