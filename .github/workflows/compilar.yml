name: Compilar el mod

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar con Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'

      - name: Compilar
        run: gradle build

      - name: Guardar el JAR compilado
        uses: actions/upload-artifact@v7
        with:
          name: vfxshadersmod-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
