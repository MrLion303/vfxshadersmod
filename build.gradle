plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version
base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.logging.markers', 'REGISTRIES'
        }

        server {
            args '--nogui'
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Genera texturas de referencia a partir de las imágenes guía del proyecto.
// Se usan como mapas de color/densidad sobre geometría 3D y volúmenes raymarched.
def vfxReferenceResources = layout.buildDirectory.dir('generated/vfxReferenceResources')

tasks.register('generateVfxReferenceTextures') {
    inputs.files(
            file('Imagenes guia/vortice_guia.png'),
            file('Imagenes guia/agujero_negro_guia.png')
    )
    outputs.dir(vfxReferenceResources)

    doLast {
        def outputDir = new File(vfxReferenceResources.get().asFile,
                'assets/vfxshadersmod/textures/vfx')
        outputDir.mkdirs()

        def clamp01 = { double value ->
            Math.max(0.0d, Math.min(1.0d, value))
        }

        def vortexSource = javax.imageio.ImageIO.read(file('Imagenes guia/vortice_guia.png'))
        int cropX = 640
        int cropY = 7
        int cropSize = 520
        def vortexTexture = new java.awt.image.BufferedImage(
                256, 256, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = vortexTexture.createGraphics()
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        graphics.drawImage(vortexSource.getSubimage(cropX, cropY, cropSize, cropSize),
                0, 0, 256, 256, null)
        graphics.dispose()

        for (int y = 0; y < 256; y++) {
            for (int x = 0; x < 256; x++) {
                int pixel = vortexTexture.getRGB(x, y)
                double red = (pixel >> 16) & 255
                double green = (pixel >> 8) & 255
                double blue = pixel & 255
                double luminance = 0.2126d * red + 0.7152d * green + 0.0722d * blue
                double warm = clamp01((red - Math.max(green * 0.72d, blue * 1.10d) + 14.0d) / 120.0d)
                double bright = clamp01((luminance - 38.0d) / 110.0d)
                double alpha = warm * bright
                alpha = alpha * alpha * (3.0d - 2.0d * alpha)
                alpha *= clamp01((red - blue + 5.0d) / 65.0d) * clamp01((green - 16.0d) / 70.0d)

                // Máscara ovalada centrada en el vórtice: elimina el cielo rojizo de la
                // captura y los objetos del escenario, conservando las nubes de la periferia.
                double dx = (x - 122.0d) / 150.0d
                double dy = (y - 125.0d) / 140.0d
                double radial = Math.sqrt(dx * dx + dy * dy * 1.08d)
                double silhouette = 1.0d
                if (radial >= 0.73d) {
                    silhouette = 0.0d
                } else if (radial > 0.52d) {
                    double t = (radial - 0.52d) / (0.73d - 0.52d)
                    silhouette = 1.0d - t * t * (3.0d - 2.0d * t)
                }
                alpha *= silhouette

                int a = (int) Math.round(clamp01(alpha) * 255.0d)
                vortexTexture.setRGB(x, y, (a << 24) | (pixel & 0x00FFFFFF))
            }
        }
        javax.imageio.ImageIO.write(vortexTexture, 'png',
                new File(outputDir, 'vortex_reference.png'))

        def holeSource = javax.imageio.ImageIO.read(file('Imagenes guia/agujero_negro_guia.png'))
        int textureWidth = 512
        int textureHeight = 128
        def diskTexture = new java.awt.image.BufferedImage(
                textureWidth, textureHeight, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        double centerX = 405.0d
        double centerY = 248.0d

        for (int y = 0; y < textureHeight; y++) {
            double radial = y / (double) (textureHeight - 1)
            // Muestrea solo el plasma próximo al horizonte; radios mayores capturaban
            // estrellas, el haz del cielo y partes del terreno de la imagen de referencia.
            double radius = 65.0d + radial * 48.0d
            for (int x = 0; x < textureWidth; x++) {
                double angle = 2.0d * Math.PI * x / textureWidth
                double yScale = 0.60d - 0.045d * Math.sin(angle)
                int sampleX = (int) Math.round(centerX + Math.cos(angle) * radius)
                int sampleY = (int) Math.round(centerY + Math.sin(angle) * radius * yScale)
                int pixel = 0
                if (sampleX >= 0 && sampleX < holeSource.width
                        && sampleY >= 0 && sampleY < holeSource.height) {
                    pixel = holeSource.getRGB(sampleX, sampleY)
                }

                double red = (pixel >> 16) & 255
                double green = (pixel >> 8) & 255
                double blue = pixel & 255
                double luminance = 0.2126d * red + 0.7152d * green + 0.0722d * blue
                // Hue mask selectiva: conserva plasma naranja/crema y descarta estrellas,
                // resplandores grises y fondo violeta, evitando un contorno espacial enorme.
                double warmRed = clamp01((red - green * 0.82d + 6.0d) / 80.0d)
                double warmBlue = clamp01((red - blue * 0.92d + 8.0d) / 70.0d)
                double luminous = clamp01((luminance - 24.0d) / 120.0d)
                double alpha = warmRed * warmBlue * luminous
                alpha = alpha * alpha * (3.0d - 2.0d * alpha)
                alpha *= 0.78d + 0.22d * (1.0d - radial)

                int a = (int) Math.round(clamp01(alpha) * 255.0d)
                diskTexture.setRGB(x, y, (a << 24) | (pixel & 0x00FFFFFF))
            }
        }
        javax.imageio.ImageIO.write(diskTexture, 'png',
                new File(outputDir, 'blackhole_disk_reference.png'))

    }
}

sourceSets.main.resources.srcDir(vfxReferenceResources)

tasks.named('processResources').configure {
    dependsOn tasks.named('generateVfxReferenceTextures')
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
    // Archivo oficial de Photon para Forge 1.20.1.
    maven { url = 'https://cursemaven.com' }
    // Publicación de Photon y LowDragLib para integración Java.
    maven { url = 'https://maven.firstdarkdev.xyz/snapshots' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:photon-871522:7501597") { transitive = false }
    implementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42") { transitive = false }
}

tasks.named('processResources').configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Si el archivo del proyecto existe en la raíz, se incluye como textura del portal.
def panoramaOverlay = file('panorama_overlay.png')
if (panoramaOverlay.exists()) {
    tasks.named('processResources').configure {
        from(panoramaOverlay) {
            into 'assets/vfxshadersmod/textures/vfx'
            rename { 'panorama_overlay.png' }
        }
    }
}

tasks.named('jar').configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version.toString(),
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
